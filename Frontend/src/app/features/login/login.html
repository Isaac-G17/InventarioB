<div class="login-contenedor">
  <form class="login-tarjeta" [formGroup]="formulario" (ngSubmit)="enviar()">

    <h1>Iniciar sesión</h1>

    <label for="username">Usuario</label>
    <input id="username" type="text" formControlName="username" autocomplete="username" />

    @if (formulario.controls.username.touched && formulario.controls.username.invalid) {
      <small class="error">El usuario es obligatorio</small>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    @if (formulario.controls.password.touched && formulario.controls.password.invalid) {
      <small class="error">La contraseña debe tener al menos 4 caracteres</small>
    }

    @if (error()) {
      <p class="error-servidor">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
